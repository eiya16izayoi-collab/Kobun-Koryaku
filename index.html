<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古文単語四択クイズアプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }
    </style>
</head>
<body class="bg-amber-50 min-h-screen text-stone-800 flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-amber-800 text-amber-50 shadow-md py-4 px-6 mb-6">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span>⛩️</span> 古文単語 4択マスター
            </h1>
            <span id="header-status" class="text-xs bg-amber-900 px-3 py-1 rounded-full border border-amber-700">準備完了</span>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow max-w-2xl w-full mx-auto px-4 pb-12">
        
        <!-- スタート画面 -->
        <div id="setup-view" class="bg-white rounded-2xl shadow-lg p-6 mb-6 border border-amber-200 text-center">
            <div class="text-4xl mb-3">📜</div>
            <h2 class="text-xl font-bold text-amber-900 mb-2">古典単語マスターへようこそ</h2>
            <p class="text-xs text-stone-500 mb-6 max-w-md mx-auto">
                出題モードを選んでください。ご指定いただいた豊富な古文単語データからランダムな4択問題に挑戦できます。
            </p>
            
            <div class="bg-amber-50 rounded-xl p-4 mb-6 border border-amber-200 text-left max-w-md mx-auto">
                <p class="text-xs font-bold text-amber-900 mb-1">収録データ情報</p>
                <p id="data-count-info" class="text-xs text-stone-600">読み込み中...</p>
            </div>

            <!-- モード選択ボタン -->
            <div class="flex flex-col sm:flex-row justify-center gap-3">
                <button id="start-quiz-10-btn" class="bg-amber-700 hover:bg-amber-800 text-white font-bold py-3 px-6 rounded-xl shadow-md transition transform active:scale-95 text-sm">
                    ✨ 通常モード（10問）
                </button>
                <button id="start-quiz-all-btn" class="bg-stone-800 hover:bg-stone-900 text-white font-bold py-3 px-6 rounded-xl shadow-md transition transform active:scale-95 text-sm">
                    🔥 オール復習モード（全問）
                </button>
            </div>
        </div>

        <!-- クイズ画面 (初期非表示) -->
        <div id="quiz-view" class="hidden">
            <!-- 進捗・スコアバー -->
            <div class="flex justify-between items-center mb-4 bg-white px-4 py-3 rounded-xl border border-amber-200 shadow-sm">
                <div class="text-sm font-bold text-amber-900">
                    問題 <span id="current-q-num">1</span> / <span id="total-q-num">10</span>
                </div>
                <div class="text-sm font-bold text-emerald-700">
                    正解数: <span id="score-num">0</span>
                </div>
            </div>

            <!-- 問題カード -->
            <div class="bg-white rounded-2xl shadow-lg p-6 sm:p-8 mb-6 border border-amber-200 text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 right-0 h-1.5 bg-amber-200">
                    <div id="progress-bar" class="h-full bg-amber-600 transition-all duration-300" style="width: 0%;"></div>
                </div>

                <span class="inline-block bg-amber-100 text-amber-800 text-xs font-semibold px-3 py-1 rounded-full mb-3">
                    次の古文単語の意味として正しいものは？
                </span>
                
                <h2 id="target-word" class="text-3xl sm:text-4xl font-extrabold text-stone-900 my-4 tracking-wider">
                    単語
                </h2>

                <!-- 四択ボタンエリア -->
                <div id="choices-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-6">
                    <!-- 動的生成 -->
                </div>

                <!-- 解説・次へ進むボタン -->
                <div id="feedback-area" class="mt-6 hidden pt-4 border-t border-stone-100 flex flex-col items-center">
                    <p id="feedback-text" class="text-base font-bold mb-3"></p>
                    <button id="next-btn" class="bg-stone-900 hover:bg-stone-800 text-white font-bold py-2 px-8 rounded-xl shadow transition text-sm">
                        次の問題へ ➔
                    </button>
                </div>
            </div>

            <!-- 最初に戻るボタン -->
            <div class="text-center">
                <button id="back-to-setup-btn" class="text-xs text-stone-500 hover:text-stone-800 underline">
                    ← スタート画面に戻る
                </button>
            </div>
        </div>

        <!-- 結果画面 (初期非表示) -->
        <div id="result-view" class="hidden bg-white rounded-2xl shadow-lg p-8 text-center border border-amber-200">
            <div class="text-5xl mb-4">🏆</div>
            <h2 class="text-2xl font-bold text-stone-900 mb-2">お疲れ様でした！</h2>
            <p class="text-stone-600 mb-6">クイズが終了しました。</p>
            
            <div class="bg-amber-50 rounded-xl p-4 max-w-xs mx-auto mb-6 border border-amber-200">
                <p class="text-xs text-stone-500">正解率</p>
                <p class="text-3xl font-extrabold text-amber-800 my-1"><span id="final-score">0</span> / <span id="final-total">0</span></p>
                <p id="result-message" class="text-xs text-stone-600 mt-1 font-medium"></p>
            </div>

            <div class="flex justify-center gap-3">
                <button id="restart-btn" class="bg-amber-700 hover:bg-amber-800 text-white font-bold py-2.5 px-6 rounded-xl shadow transition text-sm">
                    もう一度挑戦する 🔄
                </button>
            </div>
        </div>

    </main>

    <footer class="text-center py-4 text-xs text-stone-500 border-t border-amber-200 mt-auto bg-amber-100/50">
        古文単語四択クイズシステム &copy; 2026
    </footer>

            "消息,訪問の申し入れ",
            "遊び,管弦の遊び",
            "遊び,音楽を奏で楽しむ",
            "上,帝",
            "上,北の方",
            "公,朝廷",
            "公,帝",
            "うち,帝",
            "うち,宮中",
            "御前,お側",
            "御前,〜様",
            "みゆき,お出まし",
            "たより,よりどころ",
            "たより,つて",
            "たより,よい機会",
            "物語,世間話",
            "物語,物語",
            "ためし,先例",
            "いそぎ,準備する",
            "用意,気配り",
            "かたち,容貌",
            "かげ,光",
            "かげ,姿",
            "けしき,様子",
            "けしき,機嫌",
            "けしき,意向",
            "けしき,思いを示す",
            "こころざし,愛情",
            "こころざし,お礼の贈り物",
            "ほい,かねてからの願い"
        ];

        // 状態管理
        let parsedData = []; // 重複する単語(A)を適切にグループ化したデータ
        let quizList = [];   
        let currentIndex = 0;
        let score = 0;
        let isAnswered = false;
        let currentMode = 10; 

        // DOM要素
        const setupView = document.getElementById('setup-view');
        const quizView = document.getElementById('quiz-view');
        const resultView = document.getElementById('result-view');
        
        const startQuiz10Btn = document.getElementById('start-quiz-10-btn');
        const startQuizAllBtn = document.getElementById('start-quiz-all-btn');
        const dataCountInfo = document.getElementById('data-count-info');
        
        const targetWordEl = document.getElementById('target-word');
        const choicesContainer = document.getElementById('choices-container');
        const feedbackArea = document.getElementById('feedback-area');
        const feedbackText = document.getElementById('feedback-text');
        const nextBtn = document.getElementById('next-btn');
        
        const currentQNumEl = document.getElementById('current-q-num');
        const totalQNumEl = document.getElementById('total-q-num');
        const scoreNumEl = document.getElementById('score-num');
        const progressBar = document.getElementById('progress-bar');
        
        const finalScoreEl = document.getElementById('final-score');
        const finalTotalEl = document.getElementById('final-total');
        const resultMessageEl = document.getElementById('result-message');
        const restartBtn = document.getElementById('restart-btn');
        const backToSetupBtn = document.getElementById('back-to-setup-btn');
        const headerStatus = document.getElementById('header-status');

        // データをパースする処理
        // 同一の単語Aが複数の意味Bを持つ場合を考慮し、マップで { word: [意味1, 意味2...] } の形にまとめます
        function parseKobunData(dataArray) {
            const map = new Map(); 

            for (let line of dataArray) {
                const parts = line.split(/[,,\t、]/);
                if (parts.length >= 2) {
                    const word = parts[0].trim();
                    const meaning = parts.slice(1).join(',').trim(); 
                    if (word && meaning) {
                        if (!map.has(word)) {
                            map.set(word, new Set());
                        }
                        map.get(word).add(meaning);
                    }
                }
            }

            const result = [];
            for (let [word, meaningsSet] of map.entries()) {
                result.push({ 
                    word: word, 
                    meanings: Array.from(meaningsSet) 
                });
            }
            return result;
        }

        // 初期化処理
        window.addEventListener('DOMContentLoaded', () => {
            parsedData = parseKobunData(rawKobunData);
            dataCountInfo.textContent = `入力行数: ${rawKobunData.length} 件（ユニーク単語数: ${parsedData.length} 語）`;
        });

        // 配列シャッフル関数
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // クイズ開始処理
        function startQuiz(mode) {
            if (parsedData.length < 4) {
                alert('四択クイズを作成するためには、最低4つ以上の異なる単語データが必要です。');
                return;
            }

            currentMode = mode;
            const questionCount = (mode === 'all') ? parsedData.length : Math.min(10, parsedData.length);
            
            quizList = shuffleArray([...parsedData]).slice(0, questionCount);
            
            currentIndex = 0;
            score = 0;

            setupView.classList.add('hidden');
            resultView.classList.add('hidden');
            quizView.classList.remove('hidden');
            headerStatus.textContent = (mode === 'all') ? 'オール復習モード' : '通常モード（10問）';

            loadQuestion();
        }

        startQuiz10Btn.addEventListener('click', () => startQuiz(10));
        startQuizAllBtn.addEventListener('click', () => startQuiz('all'));

        // 問題の読み込み
        function loadQuestion() {
            isAnswered = false;
            feedbackArea.classList.add('hidden');
            
            const currentItem = quizList[currentIndex];
            targetWordEl.textContent = currentItem.word;

            currentQNumEl.textContent = currentIndex + 1;
            totalQNumEl.textContent = quizList.length;
            scoreNumEl.textContent = score;
            progressBar.style.width = `${((currentIndex) / quizList.length) * 100}%`;

            // 正解は複数ある意味の中からランダムに1つ選ぶ（または最初の意味）
            const correctMeaning = currentItem.meanings[Math.floor(Math.random() * currentItem.meanings.length)];

            // 正解以外の意味候補を、他の単語の意味からランダムに3つ選ぶ
            // （同じ単語が持つ他の意味や、他の単語の意味のプールから取得）
            let allOtherMeanings = [];
            parsedData.forEach(item => {
                if (item.word !== currentItem.word) {
                    item.meanings.forEach(m => allOtherMeanings.push(m));
                }
            });

            // 万が一プールが足りない場合のフォールバックとして他の単語の全意味を対象にする
            if (allOtherMeanings.length < 3) {
                parsedData.forEach(item => {
                    item.meanings.forEach(m => {
                        if (m !== correctMeaning) allOtherMeanings.push(m);
                    });
                });
            }

            const shuffledOthers = shuffleArray(allOtherMeanings);
            // 重複のないように3つ選ぶ
            const uniqueOthers = [...new Set(shuffledOthers)].slice(0, 3);

            let choices = [correctMeaning, ...uniqueOthers];
            choices = shuffleArray(choices);

            choicesContainer.innerHTML = '';
            choices.forEach((choiceText) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn text-left p-4 rounded-xl border border-amber-200 bg-amber-50/50 hover:bg-amber-100/80 font-medium text-stone-700 text-sm sm:text-base transition shadow-sm flex items-center justify-between group';
                btn.innerHTML = `
                    <span>${choiceText}</span>
                    <span class="w-5 h-5 rounded-full border border-amber-300 flex items-center justify-center text-xs text-transparent group-hover:border-amber-500">●</span>
                `;
                btn.addEventListener('click', () => handleAnswer(choiceText, correctMeaning, currentItem.meanings, btn));
                choicesContainer.appendChild(btn);
            });
        }

        // 解答処理
        function handleAnswer(selectedChoice, correctMeaning, allCorrectMeanings, clickedBtn) {
            if (isAnswered) return;
            isAnswered = true;

            const allButtons = choicesContainer.querySelectorAll('button');
            
            // 選択した意味が、その単語の正解リストのいずれかに含まれているか判定
            const isCorrect = allCorrectMeanings.includes(selectedChoice);
            
            if (isCorrect) {
                score++;
                scoreNumEl.textContent = score;
                clickedBtn.classList.remove('bg-amber-50/50', 'border-amber-200', 'hover:bg-amber-100/80');
                clickedBtn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'font-bold');
                feedbackText.textContent = '⭕ 正解です！';
                feedbackText.className = 'text-base font-bold mb-3 text-emerald-700';
            } else {
                clickedBtn.classList.remove('bg-amber-50/50', 'border-amber-200', 'hover:bg-amber-100/80');
                clickedBtn.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900', 'font-bold');
                feedbackText.textContent = `❌ 残念！ 正解例：「${allCorrectMeanings.join(' / ')}」`;
                feedbackText.className = 'text-base font-bold mb-3 text-rose-700';

                allButtons.forEach(btn => {
                    const btnText = btn.querySelector('span').textContent;
                    if (allCorrectMeanings.includes(btnText)) {
                        btn.classList.remove('bg-amber-50/50', 'border-amber-200', 'hover:bg-amber-100/80');
                        btn.classList.add('bg-emerald-50', 'border-emerald-400', 'text-emerald-800');
                    }
                });
            }

            allButtons.forEach(btn => btn.disabled = true);
            feedbackArea.classList.remove('hidden');
        }

        // 次へボタン
        nextBtn.addEventListener('click', () => {
            currentIndex++;
            if (currentIndex < quizList.length) {
                loadQuestion();
            } else {
                showResult();
            }
        });

        // 結果画面表示
        function showResult() {
            quizView.classList.add('hidden');
            resultView.classList.remove('hidden');
            headerStatus.textContent = '結果発表';

            finalScoreEl.textContent = score;
            finalTotalEl.textContent = quizList.length;

            const rate = score / quizList.length;
            if (rate === 1) {
                resultMessageEl.textContent = '満点達成！完璧です！ 🎉';
            } else if (rate >= 0.7) {
                resultMessageEl.textContent = '素晴らしい成績です！ 👏';
            } else {
                resultMessageEl.textContent = '復習してもう一度チャレンジしてみましょう！';
            }
        }

        // もう一度挑戦
        restartBtn.addEventListener('click', () => {
            startQuiz(currentMode);
        });

        backToSetupBtn.addEventListener('click', () => {
            quizView.classList.add('hidden');
            setupView.classList.remove('hidden');
            headerStatus.textContent = '準備完了';
        });
    </script>
</body>
</html>
